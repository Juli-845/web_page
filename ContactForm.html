<!DOCTYPE html>
<html>

<head>

    <title>CONTACT FORM</title>
</head>

<body>

    <h2>Student Registration Form</h2>

    <form>
        <table border="1">
            <tr>
                <th colspan="2">Student Details</th>
            </tr>

            <tr>
                <td>Full Name</td>
                <td><input type="text" placeholder="Enter your name" required></td>
            </tr>

            <tr>
                <td>Email</td>
                <td><input type="email" placeholder="Enter your email" required></td>
            </tr>

            <tr>
                <td>Phone Number</td>
                <td><input type="tel" placeholder="Enter phone number"></td>
            </tr>

            <tr>
                <td>Gender</td>
                <td>
                    <input type="radio" name="gender" value="Male"> Male
                    <input type="radio" name="gender" value="Female"> Female
                </td>
            </tr>

            <tr>
                <td>Course</td>
                <td>
                    <select>
                        <option>BCA</option>
                        <option>B.Tech</option>
                        <option>MCA</option>
                        <option>BBA</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Address</td>
                <td>
                    <textarea rows="4" placeholder="Enter address"></textarea>
                </td>
            </tr>

            <tr>
                <td colspan="2" style="text-align:center">
                    <button type="submit">Submit</button>
                    <button type="reset">Reset</button>
                </td>
            </tr>
        </table>
    </form>

</body>

</html>
